<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortex.io - OS Créatif & Accessible</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --border-color: #1f2937;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --magic-color: #0d9488;
            --magic-hover: #0f766e;
            --image-color: #ec4899;
            --image-hover: #db2777;
            --dict-color: #f59e0b;
            --dict-hover: #d97706;
            --mic-color: #ef4444;
            --mic-hover: #dc2626;
            --clear-color: #374151;
            --clear-hover: #4b5563;
            --donate-color: #f43f5e;
            --donate-hover: #e11d48;
            --placeholder-color: #6b7280;
        }

        :root.theme-light {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --accent-color: #4f46e5;
            --accent-hover: #3730a3;
            --magic-color: #0f766e;
            --magic-hover: #115e59;
            --clear-color: #9ca3af;
            --clear-hover: #4b5563;
            --placeholder-color: #9ca3af;
        }

        :root.theme-cyberpunk {
            --bg-color: #1a002c;
            --card-bg: #2d004d;
            --text-color: #00ffcc;
            --border-color: #ff007f;
            --accent-color: #ff007f;
            --accent-hover: #cc0066;
            --magic-color: #00ffcc;
            --magic-hover: #00ccaa;
            --clear-color: #3d0066;
            --clear-hover: #520085;
            --placeholder-color: #8800ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #818cf8, #34d399, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 0.85rem;
            color: var(--placeholder-color);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, input[type="number"], input[type="text"], input[type="range"] {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        input[type="range"] { padding: 0; width: 80px; cursor: pointer; }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 4px;
            color: white;
        }

        button:active { transform: scale(0.97); }

        button:focus, textarea:focus, select:focus, input:focus {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        .btn-download { background-color: var(--accent-color); }
        .btn-download:hover { background-color: var(--accent-hover); }
        .btn-magic { background-color: var(--magic-color); }
        .btn-magic:hover { background-color: var(--magic-hover); }
        .btn-image { background-color: var(--image-color); }
        .btn-image:hover { background-color: var(--image-hover); }
        .btn-dict { background-color: var(--dict-color); }
        .btn-dict:hover { background-color: var(--dict-hover); }
        .btn-clear { background-color: var(--clear-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-clear:hover { background-color: var(--clear-hover); }
        .btn-danger { background-color: var(--mic-color); }
        .btn-donate { background-color: var(--donate-color); font-weight: 600; }
        .btn-donate:hover { background-color: var(--donate-hover); }
        
        .btn-style {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .btn-style.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .btn-music-sym {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1rem;
            padding: 4px 10px;
        }
        .btn-music-sym:hover {
            border-color: var(--image-color);
            background-color: rgba(236, 72, 153, 0.1);
        }

        .btn-mic { background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-mic.recording {
            background-color: var(--mic-color);
            color: white;
            border-color: var(--mic-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .workspace {
            display: flex;
            flex: 1;
            gap: 15px;
            height: 100%;
            min-height: 0;
        }

        textarea {
            flex: 2;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: inherit;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        #dictPanel { display: none; }
        #dictPanel.active { display: flex; }
        
        #imagePanel { align-items: center; justify-content: center; min-height: 200px; position: relative; }
        
        .panel h3 { margin-top: 0; font-size: 1rem; color: #818cf8; margin-bottom: 10px; width: 100%; }
        
        #generatedImage {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            object-fit: contain;
            display: none;
            margin-bottom: 10px;
        }

        #downloadImgBtn { display: none; background-color: var(--clear-color); width: 100%; justify-content: center; }
        .image-placeholder { color: var(--placeholder-color); text-align: center; font-size: 0.85rem; font-style: italic; }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 34px; height: 34px; border-radius: 50%;
            border-left-color: var(--image-color); animation: spin 1s linear infinite; display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dict-search, .story-controls { display: flex; gap: 5px; margin-bottom: 10px; }
        .dict-results { font-size: 0.9rem; line-height: 1.4; color: #9ca3af; }

        .story-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .story-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--placeholder-color);
        }

        .footer-badges {
            display: flex;
            gap: 10px;
        }

        .counter-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .license-link {
            color: var(--placeholder-color);
            text-decoration: none;
            font-style: italic;
        }
